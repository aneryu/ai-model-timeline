:root{--bg:#fbfbf9;--ink:#1b1c1f;--ink2:#55585e;--mut:#8b8e94;--rule:#ecece7;--rule2:#d6d6cf;--bar:#dcdcd5;--off:#cbcbc4}
[data-theme=dark]{--bg:#141517;--ink:#ecebe6;--ink2:#b3b3ad;--mut:#818280;--rule:#232528;--rule2:#383a3e;--bar:#34363a;--off:#47494d}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 Barlow,"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.wrap{max-width:1360px;margin:0 auto;padding:44px 32px 48px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px 32px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(28px,4.2vw,46px);line-height:1.08;font-weight:700;letter-spacing:-.012em}
.lede{margin:12px 0 0;color:var(--ink2);font-size:16px;line-height:1.6;max-width:44em}
.ctrl{display:flex;align-items:center;gap:20px;padding-top:10px}
.lang{display:flex;gap:16px}
.lang button,.theme,.f{font:inherit;color:inherit;background:none;border:0;margin:0;cursor:pointer}
.lang button{color:var(--mut);font-size:14px;padding:2px 0;border-bottom:2px solid transparent}
.lang button.on{color:var(--ink);border-color:var(--ink)}
.theme{width:30px;height:30px;display:grid;place-items:center;border-radius:4px;color:var(--ink)}
.theme:hover,.f:hover{background:var(--rule)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.key{display:flex;flex-wrap:wrap;gap:8px 24px;margin:26px 0 0;font-size:13px;color:var(--ink2);align-items:center}
.key>span{display:inline-flex;align-items:center;gap:8px}
.key .hint{color:var(--mut)}
.filters{display:flex;flex-wrap:wrap;gap:2px 4px;margin:14px 0 12px 0;margin-left:-8px}
.f{display:inline-flex;align-items:center;gap:8px;padding:5px 9px 5px 8px;font-size:13.5px;border-radius:4px}
.f i{width:18px;height:5px;border-radius:3px;background:var(--c)}
.f small{color:var(--mut);font-size:12px}
.f[aria-pressed=false]{color:var(--mut)}.f[aria-pressed=false] i{background:var(--off)}
.map{display:flex;border-top:1px solid var(--rule2)}
.labels{flex:0 0 132px;position:relative}
.lab{position:absolute;left:0;right:6px;display:flex;align-items:baseline;gap:6px;font-weight:600;font-size:15px;line-height:20px;white-space:nowrap;overflow:hidden}
.lab small{font-weight:400;color:var(--mut);font-size:12px}
.div{position:absolute;left:0;right:0;border-top:1px solid var(--rule2)}
.side{position:absolute;left:0;font-size:12px;line-height:16px;color:var(--mut)}
.scroll{flex:1;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
svg{display:block}
svg text{font-family:inherit}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
#tip{position:fixed;z-index:9;display:none;width:max-content;max-width:300px;background:var(--bg);color:var(--ink);border:1px solid var(--rule2);border-top:4px solid var(--c);border-radius:4px;padding:9px 12px 11px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.12);pointer-events:none}
#tip.pin{pointer-events:auto}
#tip .co{color:var(--ink2);font-size:12px}
#tip .m{font-size:15px;font-weight:600;line-height:1.3;margin-top:7px}
#tip .s{font-size:12px;color:var(--mut);margin-top:2px}
#tip a{color:var(--ink2);text-underline-offset:2px}
#tip .tag{display:inline-block;margin-left:6px;padding:0 5px;border:1px solid var(--rule2);border-radius:3px;font-size:11px;line-height:16px;color:var(--ink2)}
#latest h3{font-size:14px;margin:20px 0 6px;color:var(--ink2);font-weight:600}#latest .lr{display:grid;grid-template-columns:14px 78px 1fr;column-gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--rule);font-size:13px}#latest .lr i{width:12px;height:5px;border-radius:3px;align-self:center}#latest .lm{font-weight:600}#latest .ls{grid-column:3;color:var(--mut);font-size:12px}
details{margin-top:26px;font-size:14px}
summary{cursor:pointer;color:var(--ink2)}
table{border-collapse:collapse;margin-top:12px;font-size:13px;width:100%;max-width:760px}
th,td{text-align:left;padding:5px 14px 5px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--ink2)}
td a{color:var(--ink2)}
footer{margin-top:28px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--mut);line-height:1.8;max-width:78em}
footer a{color:var(--ink2)}
@media(max-width:640px){.wrap{padding:26px 16px 32px}.labels{flex-basis:96px}.lab{font-size:13.5px}.lab small{display:none}.ctrl{padding-top:0}}

#mob{display:none}
@media(max-width:640px){.key,.filters,.map,#latest,details{display:none!important}#mob{display:block}
.wrap{padding:20px 0 28px}header,footer{padding-left:16px;padding-right:16px}h1{font-size:28px}.lede{font-size:14px}}
.mtop{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule2);padding:10px 0 8px}
.tabs{display:flex;gap:4px;margin:0 16px 8px;background:var(--rule);border-radius:8px;padding:3px}
.tabs button{flex:1;border:0;background:none;font:inherit;font-size:14px;color:var(--ink2);padding:7px 0;border-radius:6px;cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule2);background:var(--bg);color:var(--ink2);font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.grp{font-weight:600}.sep{flex:none;width:1px;background:var(--rule2);margin:4px 2px}
.spark{display:flex;align-items:center;gap:8px;margin:8px 16px 0;font-size:11.5px;color:var(--mut)}.spark svg{flex:1;height:22px}
.mh{position:sticky;top:var(--mt,120px);z-index:3;background:var(--bg);padding:12px 16px 6px;font-size:13px;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;border-bottom:1px solid var(--rule)}
.mh.tog{cursor:pointer}.mh.col{position:static;color:var(--ink);background:var(--rule);border-radius:6px;margin:6px 16px;padding:10px 12px;border-bottom:0}.mchev{display:inline-block;width:14px;color:var(--mut)}.mmore{display:block;margin:14px 16px 4px;width:calc(100% - 32px);font:inherit;font-size:13.5px;padding:9px;border:1px dashed var(--rule2);border-radius:8px;background:none;color:var(--ink2);cursor:pointer}
.mh small{font-weight:400;color:var(--mut)}
.card{margin:8px 16px;border:1px solid var(--rule2);border-left:5px solid var(--c);border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--bg)}
.card.maj{box-shadow:inset 0 0 0 1px var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 9%,transparent),transparent 70%)}
.card .r1{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2)}
.card .r1 b{color:var(--ink);font-weight:600}.card .r1 span{color:var(--mut);white-space:nowrap}
.card .mdl{font-size:15.5px;font-weight:600;line-height:1.3;margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 7px 1px 4px;border-radius:999px;border:1.5px solid var(--ink);margin-left:6px;vertical-align:2px}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;border:2px solid var(--ink);background:var(--bg)}
.srcs{display:none;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule2)}.card.open .srcs{display:block}
.srcs a{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink2);padding:5px 0;text-decoration:none}
.srcs a span:first-child{text-decoration:underline;text-underline-offset:2px;word-break:break-all}
.srcs .tg{flex:none;font-size:11px;border:1px solid var(--rule2);border-radius:3px;padding:0 5px;color:var(--ink2)}

  const near=e=>{const r=svg.getBoundingClientRect(),px=e.clientX-r.left;let best=null,bd=14;nodes.forEach(n=>{const dd=Math.abs(n.X-px);if(dd<bd){bd=dd;best=n}});return best};
  const at=n=>{const r=svg.getBoundingClientRect();return[r.left+n.X,r.top+n.Y]};
  hit.addEventListener("pointermove",e=>{if(pinned)return;const n=near(e);if(n){ring.setAttribute("cx",n.X);ring.setAttribute("cy",Y);ring.setAttribute("stroke",C);ring.setAttribute("visibility","visible");showTip(n,...at(n),false)}else hideTip()});
  hit.addEventListener("pointerleave",()=>{if(!pinned)hideTip()});
  hit.addEventListener("click",e=>{const n=near(e);if(!n)return;e.stopPropagation();ring.setAttribute("cx",n.X);ring.setAttribute("cy",Y);ring.setAttribute("stroke",C);ring.setAttribute("visibility","visible");pinned=n;showTip(n,...at(n),true)});
 });
 svg.appendChild(ring);
 const lt=document.getElementById("latest");lt.innerHTML=narrow?`<h3>${t.latestH}</h3>`+latest.map(r=>`<div class="lr"><i style="background:${col(r.c)}"></i><b>${cn(r.c)}</b><span class="lm">${esc(r.model)}</span><span class="ls">${r.sub}</span></div>`).join(""):"";
 sc.innerHTML="";sc.appendChild(svg);
 // 测量后处理：终点站名过长截断；标注贴边时改对齐
 lanes.forEach(L=>{
  if(L.nm){const max=TW-26;let s=L.nm.textContent;while(L.nm.getComputedTextLength()>max&&s.length>4){s=s.slice(0,-1);L.nm.textContent=s+"…"}}
  (L.lbs||[]).forEach(lb=>{const w=lb.getComputedTextLength(),X=+lb.getAttribute("x");if(X-w/2<2){lb.setAttribute("text-anchor","start");lb.setAttribute("x",Math.max(2,X-8))}else if(X+w/2>TX-3){lb.setAttribute("text-anchor","end");lb.setAttribute("x",X+8)}});
 });
 draw.ring=ring;
 if(firstDraw&&sc.scrollWidth>sc.clientWidth){sc.scrollLeft=sc.scrollWidth}firstDraw=false;
}

function showTip(n,ax,ay,pin){
 const t=I18N[lang],[y,m,d]=ymd(n.date);
 tip.style.setProperty("--c",col(n.c));
 tip.innerHTML=`<div class="co">${cn(n.c)}<span style="margin-left:10px">${t.full(y,m,d)}</span></div>`+n.arr.map(e=>`<div class="m">${esc(e.model)}</div><div class="s"><a href="${e.source}" target="_blank" rel="noopener">${host(e.source)}</a><span class="tag">${official(e.source)?t.off:t.third}</span></div>`).join("");
 tip.classList.toggle("pin",pin);tip.style.display="block";
 const w=tip.offsetWidth,h=tip.offsetHeight;
 let L=ax+14,T=ay-h-14;if(L+w>innerWidth-8)L=ax-w-14;if(L<8)L=8;if(T<8)T=ay+16;
 tip.style.left=L+"px";tip.style.top=T+"px";
}
function hideTip(){pinned=null;tip.style.display="none";tip.classList.remove("pin");if(draw.ring)draw.ring.setAttribute("visibility","hidden")}
tip.addEventListener("click",e=>e.stopPropagation());
document.addEventListener("click",()=>{if(pinned)hideTip()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")hideTip()});
document.querySelectorAll("#lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;store.set("mt-lang",lang);render()});
document.getElementById("theme").onclick=()=>{theme=theme==="dark"?"light":"dark";store.set("mt-theme",theme);render()};

let mtab="tl",msel=null;const mexp=new Set();const mopen=new Set();
const MI={zh:{tl:"时间线",lt:"各公司最新",all:"全部",major:"大版本",n:n=>`${n} 次`,ym:(y,m)=>`${y}年${m}月`,spark:"每月",none:"没有符合筛选的发布",more:n=>`展开更早的 ${n} 个月`,less:"收起更早的月份",tap:"点按展开",tot:n=>`共 ${n} 次`},
en:{tl:"Timeline",lt:"Latest by company",all:"All",major:"Major",n:n=>`${n}`,ym:(y,m)=>`${EN_M[m-1]} ${y}`,spark:"Monthly",none:"No releases match this filter",more:n=>`Show ${n} earlier months`,less:"Collapse earlier months",tap:"tap to expand",tot:n=>`${n} releases`}};
function mshow(c){return !msel||msel.has(c)}
function renderMobile(){
 if(innerWidth>640)return;
 const t=I18N[lang],m=MI[lang];
 document.getElementById("mtabs").innerHTML=[["tl",m.tl],["lt",m.lt]].map(([k,v])=>`<button data-k="${k}" class="${k===mtab?"on":""}">${v}</button>`).join("");
 document.querySelectorAll("#mtabs button").forEach(b=>b.onclick=()=>{mtab=b.dataset.k;renderMobile();scrollTo({top:document.getElementById("mob").offsetTop})});
 const grpOn=g=>msel&&ORDER.filter(c=>LINES[c][2]===g).every(c=>msel.has(c))&&msel.size===ORDER.filter(c=>LINES[c][2]===g).length;
 const cnt=c=>DATA.filter(d=>d.company===c).length;
 document.getElementById("mchips").innerHTML=`<button class="chip grp${!msel?" on":""}" data-a="all">${m.all}</button>`+["us","eu","cn"].map(g=>`<button class="chip grp${grpOn(g)?" on":""}" data-g="${g}">${t.groups[g]}</button>`).join("")+`<span class="sep"></span>`+ORDER.map(c=>`<button class="chip${msel&&msel.has(c)?" on":""}" data-c="${c}" style="--c:${col(c)}"><i></i>${cn(c)}</button>`).join("");
 document.querySelectorAll("#mchips .chip").forEach(b=>b.onclick=()=>{
  if(b.dataset.a)msel=null;
  else if(b.dataset.g){const g=b.dataset.g;msel=grpOn(g)?null:new Set(ORDER.filter(c=>LINES[c][2]===g))}
  else{const c=b.dataset.c;if(!msel)msel=new Set([c]);else{msel.has(c)?msel.delete(c):msel.add(c);if(!msel.size)msel=null}}
  renderMobile()});
 // sparkline
 const vis=DATA.filter(d=>mshow(d.company)),months=[];for(let d=new Date(2025,6,1);d<=TODAY;d=new Date(d.getFullYear(),d.getMonth()+1,1))months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
 const mc=months.map(k=>vis.filter(d=>d.date.startsWith(k)).length),mx=Math.max(1,...mc),bw=100/months.length;
 document.getElementById("mspark").innerHTML=`<span>${m.spark}</span><svg viewBox="0 0 100 22" preserveAspectRatio="none">${mc.map((v,i)=>`<rect x="${i*bw+.4}" y="${22-Math.max(v?1.5:0,v/mx*20)}" width="${bw-.8}" height="${Math.max(v?1.5:0,v/mx*20)}" fill="${v===mx?"var(--ink2)":"var(--bar)"}"/>`).join("")}</svg><span>${m.tot(vis.length)}</span>`;
 const L=document.getElementById("mlist");
 document.getElementById("mob").style.setProperty("--mt",document.getElementById("mtop").offsetHeight+"px");
 if(mtab==="lt"){
  const rows=ORDER.filter(mshow).map(c=>{const it=DATA.filter(d=>d.company===c).sort((a,b)=>a.date<b.date?1:-1)[0];return{c,it}}).sort((a,b)=>a.it.date<b.it.date?1:-1);
  L.innerHTML=rows.map(({c,it})=>{const[y,mm,dd]=ymd(it.date);return`<div class="lrow" style="--c:${col(c)}"><i></i><b>${cn(c)}</b><span class="n">${t.count(cnt(c))}</span><span class="m">${esc(it.model)}</span><span class="d">${t.sub(t.d(mm,dd),t.ago(Math.round((TODAY-pd(it.date))/DAY)))}</span></div>`}).join("")||`<div class="empty">${m.none}</div>`;
  return}
 const by={};vis.forEach(d=>{const k=d.company+"|"+d.date;(by[k]=by[k]||{c:d.company,date:d.date,arr:[]}).arr.push(d)});
 const nodes=Object.values(by).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:ORDER.indexOf(a.c)-ORDER.indexOf(b.c));
 let html="",cur="";const mcount={};nodes.forEach(n=>{const k=n.date.slice(0,7);mcount[k]=(mcount[k]||0)+n.arr.length});
 const cut=new Date(TODAY.getFullYear(),TODAY.getMonth()-3,TODAY.getDate());
 const isOld=k=>{const[y,mo]=k.split("-").map(Number);return new Date(y,mo,0)<cut};
 const oldKeys=[...new Set(nodes.map(n=>n.date.slice(0,7)))].filter(isOld),allOpen=oldKeys.length&&oldKeys.every(k=>mexp.has(k));
 let shown=false;
 nodes.forEach(n=>{const k=n.date.slice(0,7),old=isOld(k),shut=old&&!mexp.has(k);
  if(k!==cur){cur=k;const[y,mm]=k.split("-").map(Number);
   if(old&&!shown){shown=true;html+=`<button class="mmore" data-all="${allOpen?0:1}">${allOpen?m.less:m.more(oldKeys.length)}</button>`}
   html+=`<div class="mh${old?" tog":""}${shut?" col":""}"${old?` data-k="${k}" role="button" tabindex="0" aria-expanded="${!shut}"`:""}><span>${old?`<span class="mchev">${shut?"▸":"▾"}</span>`:""}${m.ym(y,mm)}</span><small>${m.tot(mcount[k])}${shut?" · "+m.tap:""}</small></div>`}
  if(shut)return;
  const[y,mm,dd]=ymd(n.date),id=n.c+"|"+n.date,maj=n.arr.find(d=>MAJOR[d.model]);
  html+=`<div class="card${maj?" maj":""}${mopen.has(id)?" open":""}" data-id="${esc(id)}" style="--c:${col(n.c)}"><div class="r1"><b>${cn(n.c)}</b><span>${t.sub(t.d(mm,dd),t.ago(Math.round((TODAY-pd(n.date))/DAY)))} <span class="chev">▾</span></span></div>`+
  n.arr.map(d=>`<div class="mdl">${esc(d.model)}${MAJOR[d.model]?`<span class="badge">${esc(MAJOR[d.model])}</span>`:""}</div>`).join("")+
  `<div class="srcs">${n.arr.map(d=>`<a href="${d.source}" target="_blank" rel="noopener"><span>${n.arr.length>1?esc(d.model)+" · ":""}${host(d.source)}</span><span class="tg">${official(d.source)?t.off:t.third}</span></a>`).join("")}</div></div>`});
 L.innerHTML=html||`<div class="empty">${m.none}</div>`;
 L.querySelectorAll(".mh.tog").forEach(h=>{const go=()=>{const k=h.dataset.k;mexp.has(k)?mexp.delete(k):mexp.add(k);renderMobile()};h.onclick=go;h.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
 L.querySelectorAll(".mmore").forEach(b=>b.onclick=()=>{if(b.dataset.all==="1")oldKeys.forEach(k=>mexp.add(k));else oldKeys.forEach(k=>mexp.delete(k));renderMobile()});
 L.querySelectorAll(".card").forEach(e=>e.onclick=ev=>{if(ev.target.closest("a"))return;const id=e.dataset.id;mopen.has(id)?mopen.delete(id):mopen.add(id);e.classList.toggle("open")});
}
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{hideTip();draw();renderMobile()},120)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>draw());
render();
</script>
</body>
</html>
